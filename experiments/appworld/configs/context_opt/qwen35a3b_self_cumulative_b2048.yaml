# Self-compression baseline: the agent model (Qwen3.5-35B-A3B) summarizes its
# own history. Used by the perplexity experiment in CUMULATIVE (recurrent) mode:
# summary_i = LLM(prev_summary=summary_{i-1}, new_segment=segment_i).
#   * compressor model : Qwen/Qwen3.5-35B-A3B (same vLLM endpoint as the agent)
#   * budget           : 2048 tokens (each cumulative summary truncated to fit)
type: "history"
model: "Qwen/Qwen3.5-35B-A3B"
compressor_type: "full"
summary_mode: "cumulative"
prompts:
  prompt_system: "system_prompt"
  prompt_history_user: "prompt_history_v2"
history_summarization_threshold: 6144
compression_budget: 2048
preserve_last_k_turns: 0
history_summary_rule: "accumulate"
