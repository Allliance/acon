# Mask observations: keep most recent turns within budget; user/observation
# content is replaced with "[OBSERVATION MASKED]".
type: "history"
model: "none"
compressor_type: "full"
prompts:
  prompt_system: "system_prompt"
  prompt_history_user: "prompt_history_v2"
history_summarization_threshold: 2048
baseline_strategy: "mask_obs"
compression_budget: 2048
preserve_last_k_turns: 1
