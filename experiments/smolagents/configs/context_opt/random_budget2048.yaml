# Random subsample: shuffle past turns, keep as many as fit within budget,
# re-sort kept turns by original order.
type: "history"
model: "none"
compressor_type: "full"
prompts:
  prompt_system: "system_prompt"
  prompt_history_user: "prompt_history_v2"
history_summarization_threshold: 2048
baseline_strategy: "random"
compression_budget: 2048
preserve_last_k_turns: 1
random_seed: 0
