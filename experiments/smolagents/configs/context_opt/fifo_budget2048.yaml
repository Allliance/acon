# FIFO: keep most recent turns that fit within `compression_budget` tokens.
# No LLM is loaded for this baseline.
type: "history"
model: "none"
compressor_type: "full"
prompts:
  prompt_system: "system_prompt"
  prompt_history_user: "prompt_history_v2"
history_summarization_threshold: 2048
baseline_strategy: "fifo"
compression_budget: 2048
preserve_last_k_turns: 1
