[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "productive-agents"
version = "0.1.0"
description = "Codebase for ACON (Agent Context Optimization)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Minki Kang", email = "minkikang@kaist.ac.kr" }
]
dependencies = [
  "requests",
  "rich",
  "python-dotenv",
  "tiktoken",
  "numpy",
  "jinja2",
  "openai",
  "PyYAML",
  "azure-identity"
]

[project.optional-dependencies]
smolagents = [
  "smolagents"
]
officebench = [
  "fire==0.5.0",
  "pandas==2.0.3",
  "python_docx==1.1.0",
  "scikit_learn==1.3.2",
  "Pillow",
  "PyMuPDF",
  "PyPDF2",
  "pdf2docx",
  "docx2pdf",
  "pytesseract",
  "openai",
  "icalendar",
  "gymnasium",
  "rich",
  "docker",
  "mysql-connector-python",
  "rpyc",
  "openpyxl",
  "ruamel.yaml"
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-sv --durations=0"

[tool.ruff]
line-length = 119
lint.select = ["E", "F", "I", "W"]
lint.ignore = ["F403", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["productive_agents"]
lines-after-imports = 2